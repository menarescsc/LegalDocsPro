trigger:
- main # O el nombre de tu rama principal (master)

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
# 1. Instalar el motor de .NET 10
- task: UseDotNet@2
  displayName: 'Instalar .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# 2. Compilar tu API
- task: DotNetCoreCLI@2
  displayName: 'Compilar la API'
  inputs:
    command: 'build'
    projects: '**/LegalDocsPro.Api.csproj'
    arguments: '--configuration $(buildConfiguration)'

# 3. Empaquetar tu API en un ZIP
- task: DotNetCoreCLI@2
  displayName: 'Publicar la API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/LegalDocsPro.Api.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# 4. Enviar el ZIP a tu servidor gratuito de Azure
- task: AzureWebApp@1
  displayName: 'Desplegar a Azure App Service'
  inputs:
    azureSubscription: 'ConexionAzure' # Este nombre lo configuraremos en DevOps en un momento
    appType: 'webAppLinux' 
    appName: 'legaldocspro-api' # Reemplaza esto con el nombre exacto de tu App Service
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'